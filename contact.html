<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | daily.scenes7</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Core Variables & Global Styles (Same as index) --- */
        :root {
            --bg-dark: #050505;
            --bg-card: #111111;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #e50914; 
            --glass: rgba(10, 10, 10, 0.7);
            --border: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }

        /* --- Navigation --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 5%; background: var(--glass);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { width: 36px; height: 36px; filter: drop-shadow(0 4px 10px rgba(229, 9, 20, 0.4)); }
        .logo-text { font-family: 'Poppins', sans-serif; font-size: 1.6rem; display: flex; align-items: baseline; }
        .logo-daily { color: #ffffff; font-weight: 500; }
        .logo-scenes { color: var(--accent); font-weight: 800; }
        .logo-7 { color: transparent; -webkit-text-stroke: 1.5px var(--accent); font-weight: 800; font-style: italic; margin-left: 2px; font-size: 1.8rem; }
        
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: var(--text-main); }

        /* --- Contact Layout --- */
        .contact-section {
            padding: 150px 5% 80px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top right, #1a0507 0%, var(--bg-dark) 60%);
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 50px;
            max-width: 1100px;
            width: 100%;
            background: linear-gradient(145deg, #121212, #0a0a0a);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Left Side: Info */
        .contact-info {
            padding: 50px;
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.1), transparent);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .contact-info h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 15px; }
        .contact-info p { color: var(--text-muted); font-size: 1rem; margin-bottom: 40px; }
        
        .info-item { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; color: var(--text-muted); }
        .info-item i { width: 40px; height: 40px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--accent); font-size: 1.2rem; }
        
        .social-grid { display: flex; gap: 15px; margin-top: 20px; }
        .social-grid a { width: 45px; height: 45px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 1.2rem; transition: all 0.3s; }
        .social-grid a:hover { background: var(--accent); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(229, 9, 20, 0.4); }

        /* Right Side: Form */
        .contact-form-wrapper { padding: 50px; }
        .form-group { margin-bottom: 25px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .form-control {
            width: 100%; padding: 15px 20px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); border-radius: 12px; color: white;
            font-family: 'Inter', sans-serif; font-size: 1rem; outline: none; transition: all 0.3s;
        }
        .form-control:focus { border-color: var(--accent); background: rgba(255,255,255,0.06); }
        textarea.form-control { resize: vertical; min-height: 150px; }
        
        .btn-submit {
            background: linear-gradient(135deg, #E50914, #ff2c37); border: none;
            padding: 16px 30px; border-radius: 12px; color: white; font-family: 'Inter', sans-serif;
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s;
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit:hover { box-shadow: 0 10px 25px rgba(229, 9, 20, 0.4); transform: translateY(-2px); }

        /* Success Message styling */
        #result { margin-top: 15px; font-weight: 500; text-align: center; font-size: 0.9rem; }
        .text-success { color: #00ff88; }
        .text-error { color: #ff5252; }

        @media (max-width: 900px) {
            .contact-container { grid-template-columns: 1fr; }
            .contact-info { padding: 40px 30px; }
            .contact-form-wrapper { padding: 40px 30px; }
        }
        @media (max-width: 768px) { .nav-link { display: none; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">
            <svg class="logo-icon" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="42" height="42" rx="10" fill="none" stroke="url(#logo-grad)" stroke-width="3"/>
                <path d="M20 16 L36 25 L20 34 Z" fill="url(#logo-grad)"/>
                <circle cx="25" cy="25" r="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff2c37" />
                        <stop offset="100%" stop-color="#E50914" />
                    </linearGradient>
                </defs>
            </svg>
            <div class="logo-text">
                <span class="logo-daily">daily.</span><span class="logo-scenes">scenes</span><span class="logo-7">7</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="collections.html" class="nav-link">Collections</a>
            <a href="contact.html" class="nav-link active">Contact</a>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-container">
            
            <div class="contact-info">
                <div>
                    <h1>Get in Touch</h1>
                    <p>Want to request a specific movie scene, report a broken link, or just talk cinema? Drop us a message below.</p>
                    
                    <div class="info-item">
                        <i class="fa-solid fa-envelope"></i>
                        <span>hello@dailyscenes7.site</span>
                    </div>
                    <div class="info-item">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Global Cinema Network</span>
                    </div>
                </div>

                <div>
                    <h3 style="font-size: 1rem; color: white; margin-bottom: 10px;">Follow the Curation</h3>
                    <div class="social-grid">
                        <a href="https://instagram.com/daily.scenes7" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                        <a href="#"><i class="fa-brands fa-youtube"></i></a>
                    </div>
                </div>
            </div>

            <div class="contact-form-wrapper">
                
                <form action="https://api.web3forms.com/submit" method="POST" id="contactForm">
                    
                    <input type="hidden" name="access_key" value="3b4bde7a-cdf7-4868-b9aa-71b081b6bed7">
                    
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Topic</label>
                        <select id="subject" name="subject" class="form-control" required>
                            <option value="Scene Request">Scene Request</option>
                            <option value="General Inquiry">General Inquiry</option>
                            <option value="Bug Report">Report a Broken Link</option>
                            <option value="Business/Collab">Business & Collaboration</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" class="form-control" placeholder="Tell us what scene you want to see next..." required></textarea>
                    </div>

                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                    <button type="submit" class="btn-submit">
                        Send Message <i class="fa-solid fa-paper-plane"></i>
                    </button>

                    <p id="result"></p>
                </form>

            </div>
        </div>
    </section>

    <script>
        const form = document.getElementById('contactForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);
            
            result.innerHTML = "Sending message...";
            result.className = "text-muted";

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    result.innerHTML = "Message sent successfully! We'll be in touch.";
                    result.className = "text-success";
                    form.reset();
                } else {
                    console.log(response);
                    result.innerHTML = json.message;
                    result.className = "text-error";
                }
            })
            .catch(error => {
                console.log(error);
                result.innerHTML = "Something went wrong. Please try again.";
                result.className = "text-error";
            })
            .then(function() {
                setTimeout(() => {
                    result.style.display = "none";
                }, 5000);
            });
        });
    </script>
</body>
</html>
